<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
  <title id="title">Rotating motivational quotes</title>
  <desc id="desc">Four motivational quotes with their authors, rotating automatically.</desc>
  <rect width="900" height="190" rx="14" fill="#161b22" stroke="#30363d"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.22;0.25;1" />
      <text x="450" y="75" fill="#e6edf3" font-size="23" font-style="italic">“The only way to do great work is to love what you do.”</text>
      <text x="450" y="125" fill="#8b949e" font-size="18">— Steve Jobs</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.24;0.27;0.47;0.50;1" />
      <text x="450" y="75" fill="#e6edf3" font-size="23" font-style="italic">“Well done is better than well said.”</text>
      <text x="450" y="125" fill="#8b949e" font-size="18">— Benjamin Franklin</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.49;0.52;0.72;0.75;1" />
      <text x="450" y="75" fill="#e6edf3" font-size="23" font-style="italic">“Nothing will work unless you do.”</text>
      <text x="450" y="125" fill="#8b949e" font-size="18">— Maya Angelou</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.74;0.77;0.97;0.99;1" />
      <text x="450" y="65" fill="#e6edf3" font-size="21" font-style="italic">“It doesn't matter if justice is on your side.</text>
      <text x="450" y="94" fill="#e6edf3" font-size="21" font-style="italic">You have to depict your position as just.”</text>
      <text x="450" y="137" fill="#8b949e" font-size="18">— Benjamin Netanyahu</text>
    </g>
  </g>
</svg>
